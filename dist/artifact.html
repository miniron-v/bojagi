<title>보자기 공방</title>
<meta name="theme-color" content="#121829">
<meta name="description" content="조각을 이어 줄을 꿰매고, 바느질 도구로 점수 엔진을 만드는 퍼즐 로그라이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Song+Myung&display=swap">

[hidden]{display:none}.reward-list{margin-top:14px;display:grid;gap:6px}.reward-line{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#ffffff0b;font-size:14px;opacity:0;transform:translate(-10px);transition:opacity .25s,transform .25s}.reward-line.in{opacity:1;transform:none}.reward-line b{color:var(--gold)}.reward-total{display:flex;justify-content:space-between;margin-top:8px;padding:10px 12px;font-size:18px;font-weight:700;border-top:1px dashed #ffffff30}.reward-total b{color:var(--gold);font-family:var(--font-display);font-size:26px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.stat-grid div{padding:10px 12px;border-radius:12px;background:#ffffff0b}.stat-grid small{display:block;font-size:12px;color:var(--muted)}.stat-grid b{font-size:20px;font-family:var(--font-display);font-weight:400}.stat-grid .new{display:block;color:var(--gold);font-size:11px;margin-top:2px}.shortfall{text-align:center;margin-top:10px;font-size:15px}.shortfall b{color:#ff9b8c;font-family:var(--font-display);font-size:24px;font-weight:400}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #ffffff12;font-size:15px}.switch{width:50px;height:30px;border-radius:15px;background:var(--indigo-3);position:relative;transition:background .2s}.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--thread);transition:transform .2s}.switch[aria-checked=true]{background:var(--good)}.switch[aria-checked=true]:after{transform:translate(20px)}.how{margin-top:14px;display:grid;gap:8px;font-size:14px;line-height:1.5;color:var(--muted)}.how p{margin:0;padding:10px 12px;border-radius:12px;background:#ffffff0b}.how b{color:var(--thread)}.pop-tip{position:absolute;z-index:35;left:16px;right:16px;padding:12px 14px;border-radius:14px;background:var(--indigo-2);box-shadow:0 10px 30px #000a,inset 0 0 0 1px #ffffff18;font-size:14px;animation:popIn .18s ease-out}.pop-tip b{font-size:16px}.pop-tip p{margin:4px 0 0;color:var(--muted);line-height:1.45}.pop-tip small{color:var(--muted)}.pop-tip .tip-action{margin-top:10px;width:100%}#toast{position:absolute;left:50%;top:18%;transform:translate(-50%);z-index:40;pointer-events:none;padding:10px 16px;border-radius:12px;background:#0f1527f0;font-size:14px;opacity:0;transition:opacity .2s}#toast.show{opacity:1}.flash{position:absolute;inset:0;pointer-events:none;z-index:19;background:var(--thread);opacity:0}@media (min-height: 760px){.score{font-size:34px}.tools{gap:8px}}@media (max-width: 370px){.end-body{grid-template-columns:90px 1fr}.stat-grid b{font-size:17px}.stat{padding:5px 7px}}@media (max-height: 720px){.tool{max-height:50px}.tools,.order{margin-top:6px}}@media (max-height: 640px){.order{padding:8px 10px}.stats{margin-top:6px}.score{font-size:24px}.tool{max-height:48px}.hud-bottom{padding-bottom:8px}.btn{min-height:46px}}@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<div id="app">
  <section id="title" class="screen" aria-label="시작 화면">
    <div>
      <h1 class="logo">보자기 공방<small>BOJAGI WORKSHOP</small></h1>
    </div>
    <canvas id="title-art" aria-hidden="true"></canvas>
    <div class="title-menu">
      <p class="best-line" id="best-line"></p>
      <button class="btn btn-gold" id="btn-continue" hidden><span>이어 짓기</span><span class="sub"></span></button>
      <button class="btn btn-seal" id="btn-new">새로 짓기</button>
      <button class="btn" id="btn-daily"><span>오늘의 의뢰</span><span class="sub"></span><span class="stamp" id="daily-stamp" hidden></span></button>
      <div class="title-foot">
        <button class="btn btn-ghost btn-small" id="btn-codex">도감 <span id="codex-count"></span></button>
        <button class="btn btn-ghost btn-small" id="btn-records">일지</button>
        <button class="btn btn-ghost btn-small" id="btn-how">방법</button>
        <button class="btn btn-ghost btn-small" id="btn-sound">소리 켬</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen" hidden aria-label="게임">
    <header class="hud-top">
      <div><span class="day-label">장날 <b id="hud-day">1</b><span id="hud-daymax">/4</span></span><span id="hud-kind" class="kind">작은 주문</span></div>
      <button class="icon-btn" id="btn-pause" aria-label="잠시 쉬기"></button>
    </header>
    <section class="order" aria-label="주문 진행">
      <div class="score-row"><span class="score" id="hud-score" aria-live="polite">0</span><span class="target">목표 <b id="hud-target">0</b></span></div>
      <div class="tally" id="tally" aria-hidden="true"></div>
      <div class="bar" id="hud-bar"><div class="ghost" id="hud-ghost"></div><div class="fill" id="hud-fill"></div></div>
      <div class="stats">
        <div class="stat" id="stat-patches"><span id="ic-patch"></span><b id="hud-patches">0</b>조각</div>
        <div class="stat coins"><span id="ic-coin"></span><b id="hud-coins">0</b></div>
        <div class="stat streak" id="hud-streak" hidden>연속 <b>0</b></div>
      </div>
      <div class="boss-line" id="hud-boss" hidden></div>
    </section>
    <div class="tools" id="hud-tools" aria-label="바느질 도구"></div>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="수틀과 조각"></canvas>
      <div class="hint" id="hint" role="status"></div>
    </div>
    <footer class="hud-bottom">
      <button class="btn btn-discard" id="btn-discard"><span class="ic" id="ic-reroll"></span>조각 바꾸기 <b id="hud-discards">2</b></button>
    </footer>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
