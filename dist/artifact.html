<title>보자기 공방</title>

<meta name="description" content="조각을 이어 줄을 꿰매고, 바느질 도구로 점수 엔진을 만드는 퍼즐 로그라이트">

nset:0 auto 0 0;width:0;border-radius:5px}.bar .fill{background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#f2c75c 10px 14px);transition:width .45s cubic-bezier(.2,.9,.3,1.2);z-index:1}.bar .ghost{background:#e7b33a99;transition:width .12s}.bar .ghost.win{background:#7fc28aaa}.bar.done .fill{background:var(--good)}.stats{display:flex;gap:6px;margin-top:10px;align-items:stretch}.stat{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:10px;background:#ffffff0d;font-size:13px;color:var(--muted);white-space:nowrap}.stat b{color:var(--thread);font-size:16px}.stat svg{width:16px;height:16px}.stat.low b{color:#ff8f80}.stat.coins b{color:var(--gold)}.stat.streak{margin-left:auto;background:#e7b33a22;color:var(--gold);transition:opacity .2s}.stat.streak b{color:var(--gold)}.stat.streak.up{animation:glow .8s ease-in-out infinite}.stat.streak.warn{opacity:.45;text-decoration:line-through}@keyframes glow{50%{box-shadow:0 0 0 3px #e7b33a55}}.boss-line{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:10px;background:#c8392c26;color:#ffc7bf;font-size:12.5px;line-height:1.3}.boss-line b{color:var(--thread);font-size:13px;white-space:nowrap}.boss-line .seal{flex:none;width:22px;height:22px;border-radius:5px;background:var(--seal);color:var(--thread);display:grid;place-items:center;font-family:var(--font-display);font-size:13px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 16px 0}.tool{position:relative;aspect-ratio:1;max-height:64px;border-radius:12px;display:grid;place-items:center;background:#0f1527b3;box-shadow:inset 0 0 0 1px #ffffff12}.tool.empty{background:transparent;box-shadow:inset 0 0 0 1.5px #ffffff14}.tool.empty:after{content:"";width:30%;height:1.5px;background:#ffffff1a}.tool svg{width:72%;height:72%}.tool .sell{position:absolute;top:-5px;left:-3px;font-size:10px;padding:1px 5px;border-radius:6px;background:var(--gold);color:#2a1b05;font-weight:700}.tool .badge{position:absolut <div id="app">
  <section id="title" class="screen" aria-label="시작 화면">
    <div>
      <h1 class="logo">보자기 공방<small>BOJAGI WORKSHOP</small></h1>
    </div>
    <canvas id="title-art" aria-hidden="true"></canvas>
    <div class="title-menu">
      <p class="best-line" id="best-line"></p>
      <button class="btn btn-gold" id="btn-continue" hidden><span>이어 짓기</span><span class="sub"></span></button>
      <button class="btn btn-seal" id="btn-new">새로 짓기</button>
      <button class="btn" id="btn-daily"><span>오늘의 의뢰</span><span class="sub"></span><span class="stamp" id="daily-stamp" hidden></span></button>
      <div class="title-foot">
        <button class="btn btn-ghost btn-small" id="btn-codex">도감 <span id="codex-count"></span></button>
        <button class="btn btn-ghost btn-small" id="btn-records">일지</button>
        <button class="btn btn-ghost btn-small" id="btn-how">방법</button>
        <button class="btn btn-ghost btn-small" id="btn-sound">소리 켬</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen" hidden aria-label="게임">
    <header class="hud-top">
      <div><span class="day-label">장날 <b id="hud-day">1</b><span id="hud-daymax">/4</span></span><span id="hud-kind" class="kind">작은 주문</span></div>
      <button class="icon-btn" id="btn-pause" aria-label="잠시 쉬기"></button>
    </header>
    <section class="order" aria-label="주문 진행">
      <div class="score-row"><span class="score" id="hud-score" aria-live="polite">0</span><span class="target">목표 <b id="hud-target">0</b></span></div>
      <div class="tally" id="tally" aria-hidden="true"></div>
      <div class="bar" id="hud-bar"><div class="ghost" id="hud-ghost"></div><div class="fill" id="hud-fill"></div></div>
      <div class="stats">
        <div class="stat" id="stat-patches"><span id="ic-patch"></span><b id="hud-patches">0</b>조각</div>
        <div class="stat coins"><span id="ic-coin"></span><b id="hud-coins">0</b></div>
        <div class="stat streak" id="hud-streak" hidden>연속 <b>0</b></div>
      </div>
      <div class="boss-line" id="hud-boss" hidden></div>
    </section>
    <div class="tools" id="hud-tools" aria-label="바느질 도구"></div>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="수틀과 조각"></canvas>
      <div class="hint" id="hint" role="status"></div>
    </div>
    <footer class="hud-bottom">
      <button class="btn btn-discard" id="btn-discard"><span class="ic" id="ic-reroll"></span>조각 바꾸기 <b id="hud-discards">2</b></button>
