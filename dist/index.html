<title>보자기 공방</title>
<meta name="theme-color" content="#121829">

nset:0 auto 0 0;width:0;border-radius:5px}.bar .fill{background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#f2c75c 10px 14px);transition:width .45s cubic-bezier(.2,.9,.3,1.2);z-index:1}.bar .ghost{background:#e7b33a99;transition:width .12s}.bar .ghost.win{background:#7fc28aaa}.bar.done .fill{background:var(--good)}.stats{display:flex;gap:6px;margin-top:10px;align-items:stretch}.stat{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:10px;background:#ffffff0d;font-size:13px;color:var(--muted);white-space:nowrap}.stat b{color:var(--thread);font-size:16px}.stat svg{width:16px;height:16px}.stat.low b{color:#ff8f80}.stat.coins b{color:var(--gold)}.stat.streak{margin-left:auto;background:#e7b33a22;color:var(--gold);transition:opacity .2s}.stat.streak b{color:var(--gold)}.stat.streak.up{animation:glow .8s ease-in-out infinite}.stat.streak.warn{opacity:.45;text-decoration:line-through}@keyframes glow{50%{box-shadow:0 0 0 3px #e7b33a55}}.boss-line{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:10px;background:#c8392c26;color:#ffc7bf;font-size:12.5px;line-height:1.3}.boss-line b{color:var(--thread);font-size:13px;white-space:nowrap}.boss-line .seal{flex:none;width:22px;height:22px;border-radius:5px;background:var(--seal);color:var(--thread);display:grid;place-items:center;font-family:var(--font-display);font-size:13px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 16px 0}.tool{position:relative;aspect-ratio:1;max-height:64px;border-radius:12px;display:grid;place-items:center;background:#0f1527b3;box-shadow:inset 0 0 0 1px #ffffff12}.tool.empty{background:transparent;box-shadow:inset 0 0 0 1.5px #ffffff14}.tool.empty:after{content:"";width:30%;height:1.5px;background:#ffffff1a}.tool svg{width:72%;height:72%}.tool .sell{position:absolute;top:-5px;left:-3px;font-size:10px;padding:1px 5px;border-radius:6px;background:var(--gold);color:#2a1b05;font-weight:700}.tool .badge{position:absolut et .eyebrow{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.25em;margin-bottom:6px}.sheet .lead{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 0;line-height:1.5}.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}.sheet .row-actions{display:flex;gap:10px;margin-top:18px}.sheet .row-actions>*{flex:1}.big-target{text-align:center;margin:14px 0 4px}.big-target .num{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--gold)}.big-target small{display:block;color:var(--muted);font-size:13px;margin-top:4px}.facts{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.fact{padding:6px 12px;border-radius:10px;background:#ffffff0d;font-size:13px;color:var(--muted)}.fact b{color:var(--thread)}.boss-card{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:var(--r-md);background:#c8392c22;box-shadow:inset 0 0 0 1px #c8392c66}.boss-card .seal{flex:none;width:46px;height:46px;border-radius:8px;background:var(--seal);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px #ffffff30}.boss-card b{display:block;font-size:16px}.boss-card span{font-size:13px;color:#ffc7bf}.day-track{display:flex;justify-content:center;gap:6px;margin-top:12px}.day-track i{width:22px;height:6px;border-radius:3px;background:#ffffff18}.day-track i.done{background:var(--good)}.day-track i.now{background:var(--gold)}.day-track i.boss{width:30px}.cards{display:grid;gap:10px;margin-top:16px}.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:var(--r-md);background:var(--indigo-2);box-shadow:inset 0 0 0 1px #ffffff10}.card.r2{box-shadow:inset 0 0 0 1.5px #6f9be066}.card.r3{box-shadow:inset 0 0 0 1.5px #e7b33a99;background:linear-gradient(135deg,var(--indigo-2),#3a3a5e)}.card .art{width:56px;height:56px;border-radius:12px;background:#0 ist{display:grid;gap:4px;margin-top:6px}.daily-list div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:10px;background:#ffffff0b;font-size:14px}.daily-list b{color:var(--gold)}.share-text{width:100%;min-height:120px;margin-top:4px;padding:10px;border-radius:10px;background:var(--ink);color:var(--thread);border:1px solid var(--indigo-3);font:14px/1.4 var(--font-body);-webkit-user-select:text;user-select:text}.btn .stamp[hidden]{display:none}.reward-list{margin-top:14px;display:grid;gap:6px}.reward-line{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#ffffff0b;font-size:14px;opacity:0;transform:translate(-10px);transition:opacity .25s,transform .25s}.reward-line.in{opacity:1;transform:none}.reward-line b{color:var(--gold)}.reward-total{display:flex;justify-content:space-between;margin-top:8px;padding:10px 12px;font-size:18px;font-weight:700;border-top:1px dashed #ffffff30}.reward-total b{color:var(--gold);font-family:var(--font-display);font-size:26px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.stat-grid div{padding:10px 12px;border-radius:12px;background:#ffffff0b}.stat-grid small{display:block;font-size:12px;color:var(--muted)}.stat-grid b{font-size:20px;font-family:var(--font-display);font-weight:400}.stat-grid .new{display:block;color:var(--gold);font-size:11px;margin-top:2px}.shortfall{text-align:center;margin-top:10px;font-size:15px}.shortfall b{color:#ff9b8c;font-family:var(--font-display);font-size:24px;font-weight:400}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #ffffff12;font-size:15px}.switch{width:50px;height:30px;border-radius:15px;background:var(--indigo-3);position:relative;transition:background .2s}.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--thread);transition:transform .2s}.switch[aria-checked=true]{background:var(--good)}.switch[aria-checked=true]:after{transform:translate(20px)}.how{margin-top:14px;display:grid;gap:8px;font-size:14px;line-height:1.5;color:var(--muted)}.how p{margin:0;padding:10px 12px;border-radius:12px;background:#ffffff0b}.how b{color:var(--thread)}.pop-tip{position:absolute;z-index:35;left:16px;right:16px;padding:12px 14px;border-radius:14px;background:var(--indigo-2);box-shadow:0 10px 30px #000a,inset 0 0 0 1px #ffffff18;font-size:14px;animation:popIn .18s ease-out}.pop-tip b{font-size:16px}.pop-tip p{margin:4px 0 0;color:var(--muted);line-height:1.45}.pop-tip small{color:var(--muted)}.pop-tip .tip-action{margin-top:10px;width:100%}#toast{position:absolute;left:50%;top:18%;transform:translate(-50%);z-index:40;pointer-events:none;padding:10px 16px;border-radius:12px;background:#0f1527f0;font-size:14px;opacity:0;transition:opacity .2s}#toast.show{opacity:1}.flash{position:absolute;inset:0;pointer-events:none;z-index:19;background:var(--thread);opacity:0}@media (min-height: 760px){.score{font-size:34px}.tools{gap:8px}}@media (max-width: 370px){.end-body{grid-template-columns:90px 1fr}.stat-grid b{font-size:17px}.stat{padding:5px 7px}}@media (max-width: 400px){.tally .label{display:none}}@media (max-height: 700px){.boss-line .desc{display:none}.boss-line{margin-top:6px;padding:4px 8px;cursor:pointer}.boss-line:after{content:"\b20c\b7ec\c11c  \bcf4\ae30";margin-left:auto;font-size:11px;opacity:.6}}@media (max-height: 720px){.tool{max-height:50px}.tools,.order{margin-top:6px}}@media (max-height: 640px){.order{padding:8px 10px}.stats{margin-top:6px}.score{font-size:24px}.tool{max-height:48px}.hud-bottom{padding-bottom:8px}.btn{min-height:46px}}@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="app">
  <section id="title" class="screen" aria-label="시작 화면">
    <div>
      <h1 class="logo">보자기 공방<small>BOJAGI WORKSHOP</small></h1>
    </div>
    <canvas id="title-art" aria-hidden="true"></canvas>
    <div class="title-menu">
      <p class="best-line" id="best-line"></p>
      <button class="btn btn-gold" id="btn-continue" hidden><span>이어 짓기</span><span class="sub"></span></button>
      <button class="btn btn-seal" id="btn-new">새로 짓기</button>
      <button class="btn" id="btn-daily"><span>오늘의 의뢰</span><span class="sub"></span><span class="stamp" id="daily-stamp" hidden></span></button>
      <div class="title-foot">
        <button class="btn btn-ghost btn-small" id="btn-codex">도감 <span id="codex-count"></span></button>
        <button class="btn btn-ghost btn-small" id="btn-records">일지</button>
        <button class="btn btn-ghost btn-small" id="btn-how">방법</button>
        <button class="btn btn-ghost btn-small" id="btn-sound">소리 켬</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen" hidden aria-label="게임">
    <header class="hud-top">
      <div><span class="day-label">장날 <b id="hud-day">1</b><span id="hud-daymax">/4</span></span><span id="hud-kind" class="kind">작은 주문</span></div>
      <button class="icon-btn" id="btn-pause" aria-label="잠시 쉬기"></button>
    </header>
    <section class="order" aria-label="주문 진행">
      <div class="score-row"><span class="score" id="hud-score" aria-live="polite">0</span><span class="target">목표 <b id="hud-target">0</b></span></div>
      <div class="tally" id="tally" aria-hidden="true"></div>
      <div class="bar" id="hud-bar"><div class="ghost" id="hud-ghost"></div><div class="fill" id="hud-fill"></div></div>
      <div class="stats">
        <div class="stat" id="stat-patches"><span id="ic-patch"></span><b id="hud-patches">0</b>조각</div>
        <div class="stat coins"><span id="ic-coin"></span><b id="hud-coins">0</b></div>
        <div class="stat streak" id="hud-streak" hidden>연속 <b>0</b></div>
      </div>
      <div class="boss-line" id="hud-boss" hidden></div>
